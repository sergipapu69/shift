<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b1f" />
    <script>
      // Aplica el tema antes de pintar (evita el parpadeo). Preferencia guardada en la cookie shift_theme.
      (function () {
        var m = document.cookie.match(/(?:^|; )shift_theme=(dark|light|system)/);
        var pref = m ? m[1] : 'dark';
        var t = pref === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : pref;
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <title>SHIFT — Hábitos y tiempo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="splash" aria-hidden="true"><span>SHIFT</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
